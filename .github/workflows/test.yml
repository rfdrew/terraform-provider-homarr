# Build, vet and test on every push and pull request.
#
# The acceptance job boots a throwaway Homarr container, completes its onboarding
# and mints an API key, so the provider is exercised against the real API rather
# than a mock. It runs against the oldest fully supported Homarr release, the
# last one before 2.5.0 began checking the stored home boards, and the one the
# provider is verified against, on the oldest supported Terraform, the
# first with resource identity and the first with actions and list resources.
# One more run against Homarr's unreleased `dev` image flags upcoming changes
# early without failing the workflow.
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build and unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      - run: go build ./...

      - name: Unit tests
        run: make test

  docs:
    name: docs are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Regenerate docs
        run: make docs

      - name: Fail if docs are stale
        run: |
          if ! git diff --exit-code -- docs/; then
            echo "docs/ is out of date - run 'make docs' and commit the result."
            exit 1
          fi

  acceptance:
    name: acceptance tests (Homarr ${{ matrix.homarr }}, Terraform ${{ matrix.terraform }})
    runs-on: ubuntu-latest
    # The dev canary may fail on changes Homarr has not released yet; it reports
    # them without blocking the workflow.
    continue-on-error: ${{ matrix.canary }}
    strategy:
      fail-fast: false
      matrix:
        homarr: ["v2.3.0", "v2.4.1", "v2.5.2"]
        terraform: ["1.9.*", "1.12.*", "1.14.*"]
        canary: [false]
        include:
          - homarr: "dev"
            terraform: "1.14.*"
            canary: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false

      - name: Boot Homarr and mint an API key
        env:
          HOMARR_TEST_IMAGE: ghcr.io/homarr-labs/homarr:${{ matrix.homarr }}
        run: |
          chmod +x scripts/bootstrap-test-homarr.sh
          scripts/bootstrap-test-homarr.sh > /tmp/homarr.env
          # The script prints `export` lines on stdout; feed them into the job
          # environment without echoing the key into the log.
          sed 's/^export //' /tmp/homarr.env >> "$GITHUB_ENV"

      - name: Acceptance tests
        env:
          TF_ACC: "1"
        run: go test ./internal/provider/ -v -timeout 30m

      - name: Homarr logs on failure
        if: failure()
        run: docker logs --tail 200 homarr-tfprovider-test || true

      - name: Tear down Homarr
        if: always()
        run: scripts/bootstrap-test-homarr.sh --teardown || true
